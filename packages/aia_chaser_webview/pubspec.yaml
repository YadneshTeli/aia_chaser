name: aia_chaser_webview
description: Android WebView SSL error handler integration for aia_chaser, safely resolving SSL_UNTRUSTED errors via AIA chasing.
version: 0.1.0-alpha.1
homepage: https://github.com/YadneshTeli/aia_chaser
repository: https://github.com/YadneshTeli/aia_chaser/tree/master/packages/aia_chaser_webview
issue_tracker: https://github.com/YadneshTeli/aia_chaser/issues
license: BSD-3-Clause

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.22.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  aia_chaser: ^0.1.0-alpha.1
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  webview_flutter_platform_interface: ^2.10.0
